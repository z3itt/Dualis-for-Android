Summary: On-device vocal and instrumental stem separation
Description: |-
    Dualis splits a song into vocals and instrumental stems on your phone.
    Paste a Spotify, YouTube Music, or YouTube link, or open a local audio file.
    Separation uses ONNX (Kim Vocal 2 by default) with NNAPI when available
    and CPU fallback. Nothing is uploaded to a Dualis server.

    This is the Android sibling of desktop Dualis (com.z3itt.dualis).
    Distribution is GitHub Releases and F-Droid only. There is no Play Store
    build and no Google Play Services requirement.

    First run downloads the selected ONNX model (about 60–80 MB).

